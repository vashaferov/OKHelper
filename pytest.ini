[pytest]
# ────────────────────────────────────────────────────────────────────
# Пользовательские маркеры функциональности.
# Раскомментируйте параметр -m в команде запуска, чтобы прогнать
# только нужную группу:
#   pytest -m analyzer
#   pytest -m ftp
#   pytest -m smoke
# ────────────────────────────────────────────────────────────────────
markers =
    analyzer:   валидация имён файлов (ok_helper.analyzer)
    ftp:        FTP-специфичная валидация (ok_helper.ftp)
    translit:   транслитерация кириллицы
    folder:     валидация имён папок назначения на FTP
    path_walk:  поиск целевой папки по дереву
    upload:     политика разрешённых к отправке файлов
    smoke:      быстрые регрессионные тесты на ключевые сценарии
    slow:       потенциально медленные тесты

    # Allure-маркеры для группировки в отчёте.
    # Читаются AllureListener по имени (см. allure-pytest >=2.13).
    epic:       Allure epic (верхний уровень группировки)
    feature:    Allure feature (группа тестов внутри epic)
    story:      Allure story (подгруппа внутри feature)

addopts =
    -ra
    --strict-markers
    --tb=short

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
